<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#a94d48">
  <title>Bonus tuk-tuk — Senku 2</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; height: 100dvh; margin: 0; overflow: hidden; background: #a94d48; color: #fff5df; font-family: system-ui, sans-serif; touch-action: none; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .hud { position: absolute; z-index: 2; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
    .card { border: 3px solid #70485a; border-radius: 18px; padding: 8px 15px; background: #362824ef; box-shadow: 0 5px 0 #653b2c, 0 10px 24px #512d2a55; text-shadow: 0 2px #402820; }
    .title { font-size: clamp(15px, 3vw, 26px); font-weight: 950; line-height: 1.05; }
    .label { font-size: 11px; font-weight: 800; color: #f3cf96; letter-spacing: .1em; text-transform: uppercase; }
    .score { min-width: 104px; text-align: center; font-size: clamp(24px, 6vw, 46px); line-height: 1; font-weight: 1000; font-variant-numeric: tabular-nums; }
    .clock { min-width: 70px; text-align: center; font-size: clamp(24px, 5vw, 38px); line-height: 1; font-weight: 1000; font-variant-numeric: tabular-nums; }
    .score span { display: inline-block; color: #ffe26c; font-size: 1.18em; text-shadow: 0 3px #8f4e2d; }
    .unidad { font-size: 12px; }
    #reloj.urgente { color: #ff9c72; animation: pulso .55s ease-in-out infinite alternate; }
    @keyframes pulso { to { transform: scale(1.12); } }
    .controls { position:absolute; z-index:3; left:max(12px,env(safe-area-inset-left)); right:max(12px,env(safe-area-inset-right)); bottom:max(16px,env(safe-area-inset-bottom)); display:flex; justify-content:space-between; align-items:flex-end; pointer-events:none; }
    .steering { display:flex; gap:10px; }
    button { font:inherit; color:#fff4db; font-weight:900; cursor:pointer; }
    .pad { width:clamp(66px,15vw,96px); height:clamp(66px,15vw,96px); border:3px solid #ffdfa0; border-radius:50%; background:#392923dd; box-shadow:0 6px 0 #653b2c,0 9px 18px #402a26aa; font-size:clamp(24px,6vw,38px); pointer-events:auto; touch-action:none; }
    .pad:active { transform:translateY(4px); box-shadow:0 2px 0 #653b2c; background:#744b37; }
    .jump { width:clamp(84px,20vw,126px); height:clamp(84px,20vw,126px); font-size:clamp(15px,3vw,22px); background:#633323; }
    .vidas { position:absolute; z-index:4; top:max(76px,calc(env(safe-area-inset-top) + 68px)); left:max(12px,env(safe-area-inset-left)); padding:2px 10px; border-radius:12px; background:#00000066; color:#ff5f6d; font-size:clamp(22px,5vw,30px); letter-spacing:2px; text-shadow:0 2px #3a1010; pointer-events:none; }
    #sonido { position:absolute; z-index:4; top:max(76px,calc(env(safe-area-inset-top) + 68px)); right:max(12px,env(safe-area-inset-right)); padding:6px 10px; border:2px solid #70485a; border-radius:12px; background:#362824df; font-size:12px; }
    #velo { position:absolute; z-index:5; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:radial-gradient(ellipse at center,#2b211adc,#17120fc7); backdrop-filter:blur(3px); text-align:center; text-shadow:0 4px #59382d; font-size:clamp(54px,17vw,128px); font-weight:1000; color:#ffe57d; }
    #velo[hidden] { display:none; }
    #velo strong { max-width:90vw; font-size:clamp(48px,12vw,112px); }
    #velo span { max-width:90vw; font-size:clamp(18px,4vw,30px); color:white; text-shadow:0 2px #222; }
    #velo > strong:not(:first-child) { font-size:clamp(32px,8vw,72px); }
    #velo button { pointer-events:auto; padding:14px 24px; border:3px solid #ffdfa0; border-radius:18px; background:#633323; box-shadow:0 5px #653b2c; font-size:clamp(17px,4vw,24px); }
    .help { position:absolute; z-index:2; bottom:max(120px,calc(env(safe-area-inset-bottom) + 120px)); left:50%; transform:translateX(-50%); width:max-content; max-width:90vw; padding:7px 12px; border-radius:12px; background:#362824b8; text-align:center; font-size:clamp(11px,2.5vw,14px); font-weight:750; }
    @media (min-width:700px) { .help { bottom:24px; } .controls { display:none; } }
  </style>
</head>
<body>
  <canvas role="img" aria-label="Bonus de tuk-tuk por las calles empedradas de Antigua"></canvas>
  <header class="hud">
    <div class="card"><div class="label">Senku 2 · Guatemala</div><div class="title">Tuk-tuk de Antigua</div></div>
    <div class="card score"><div class="label">Churus</div><span id="marcador">00</span><small class="unidad"> / 30</small></div>
    <div class="card clock"><div class="label">Tiempo</div><span id="reloj">30</span><small class="unidad"> s</small></div>
  </header>
  <div class="vidas" aria-label="Corazones del bonus"><span id="corazones">♥♥♥</span></div>
  <button id="sonido" type="button">Sonido</button>
  <div class="help">A / D o ← / → para moverte sobre el tuk-tuk · Espacio / W / ↑ para saltar</div>
  <nav class="controls" aria-label="Controles táctiles">
    <div class="steering"><button class="pad" data-control="izquierda" aria-label="Moverse a la izquierda">◀</button><button class="pad" data-control="derecha" aria-label="Moverse a la derecha">▶</button></div>
    <button class="pad jump" data-control="salto" aria-label="Saltar por churus y esquivar obstáculos">¡SALTA!</button>
  </nav>
  <div id="velo">3</div>
  <script type="module">
    import { iniciarBonus } from './src/bonus_tuk_tuk.mjs';
    window.__bonusTukTuk = iniciarBonus(document, window);
  </script>
</body>
</html>
