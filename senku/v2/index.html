<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Senku 2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1614">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icon/senku-icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="../../assets/icon/senku-icon-192.png">
  <title>Senku 2 — Taquería</title>
  <link rel="stylesheet" href="./src/ui/menu.css">
  <style>
    :root {
      --vh: 100vh;
      --app-height: 100vh;
      --app-width: 100vw;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      background-color: #1a1614;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    #app {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 0;
    }

    .lienzo-envoltura {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #lienzo-juego {
      display: block;
      background-color: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      touch-action: none;
    }

    [hidden] { display: none !important; }
    button { font: inherit; cursor: pointer; color: #fff4dc; }
    button:focus-visible { outline: 3px solid #ffe3a0; outline-offset: 3px; }
    .hud-superior {
      position: absolute; z-index: 20;
      top: calc(env(safe-area-inset-top, 0px) + 8px);
      left: calc(env(safe-area-inset-left, 0px) + 12px);
      right: calc(env(safe-area-inset-right, 0px) + 12px);
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; pointer-events: none;
      flex-wrap: nowrap;
    }
    .hud-grupo-izq, .hud-grupo-der {
      display: flex; align-items: center; gap: 8px; pointer-events: none;
    }
    .hud-pildora, .btn-control, .joystick {
      background: #241c1ce6; border: 2px solid #bdb0a0;
      box-shadow: 0 4px 12px #0006, inset 0 1px 2px #fff3;
    }
    .hud-pildora { display: flex; align-items: center; gap: 8px; padding: 5px 12px;
      border-radius: 12px; font-weight: 750; color: #fff4dc; font-size: 13px; }
    .hud-vida { padding: 4px 10px 4px 4px; gap: 8px; }
    .retrato { width: 44px; height: 44px; object-fit: cover; border-radius: 8px;
      image-rendering: pixelated; background: #392a24; }
    .salud { display: grid; gap: 3px; }
    .barra-vida-contenedor { width: 104px; height: 11px; border: 1px solid #f7dbb2;
      border-radius: 4px; overflow: hidden; background: #130e10; }
    .barra-vida-relleno { height: 100%; width: 100%; background: #22c55e; transition: width 0.15s ease; }
    .texto-vida { font-variant-numeric: tabular-nums; }
    .salud small { font-size: 11px; }
    .icono-churu { width: 24px; height: 36px; object-fit: contain; }
    .hud-escena { font-size: 12px; border: 0; box-shadow: none; background: #241c1cb8; }
    .hud-btn { pointer-events: auto; min-height: 42px; touch-action: manipulation; }
    .hud-btn:active, .hud-btn.presionado { background: #6d432b; }
    #hud-traje { }
    #btn-pausa { width: 44px; height: 44px; padding: 8px; display: flex; align-items: center; justify-content: center; }
    svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .zona-controles { position: absolute; z-index: 30;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      left: calc(env(safe-area-inset-left, 0px) + 14px);
      right: calc(env(safe-area-inset-right, 0px) + 14px);
      display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
    .joystick { position: relative; width: 124px; height: 124px; border-radius: 50%;
      touch-action: none; -webkit-touch-callout: none; pointer-events: auto; user-select: none; }
    .joystick .palanca { position: absolute; width: 50px; height: 50px; left: calc(50% - 25px);
      top: calc(50% - 25px); border-radius: 50%; background: #a7a0a1;
      border: 3px solid #e5d8cb; box-shadow: 0 3px 6px #0009;
      transform: translate(var(--palanca-x, 0px), var(--palanca-y, 0px)); pointer-events: none; }
    .joystick svg { position: absolute; width: 18px; height: 18px; opacity: .7; pointer-events: none; }
    .direccion-arriba { top: 6px; left: calc(50% - 9px); }
    .direccion-abajo { bottom: 6px; left: calc(50% - 9px); transform: rotate(180deg); }
    .direccion-izquierda { left: 6px; top: calc(50% - 9px); transform: rotate(-90deg); }
    .direccion-derecha { right: 6px; top: calc(50% - 9px); transform: rotate(90deg); }

    /* Disposición de botones estilo Gamepad 2x2 para celular (ergonómica, sin solapamientos) */
    .grupo-accion {
      display: grid;
      grid-template-columns: repeat(2, auto);
      grid-template-rows: repeat(3, auto);
      grid-template-areas:
        "gancho subir"
        "desliz salto"
        "ataque salto";
      gap: 10px;
      align-items: center;
      justify-items: center;
      pointer-events: none;
    }
    #btn-gancho { grid-area: gancho; }
    #btn-subir { grid-area: subir; }
    #btn-atacar { grid-area: ataque; }
    #btn-salto { grid-area: salto; }
    #btn-desliz { grid-area: desliz; width: 62px; height: 62px; border-color: #a78bfa; background: #2e1065e6; }
    #btn-desliz.presionado, #btn-desliz:active { background: #5b21b6e6; transform: scale(0.94); }
    #btn-disparar { grid-area: gancho; }
    #btn-lanzagranadas { grid-area: subir; }

    .btn-control {
      pointer-events: auto; touch-action: none; -webkit-touch-callout: none;
      width: 74px; height: 74px;
      min-width: 44px; min-height: 44px; border-radius: 50%; display: flex;
      flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      font-size: 11px; font-weight: 800; border: 2.5px solid #bdb0a0;
      user-select: none; -webkit-user-select: none;
    }
    .btn-control * { pointer-events: none; }
    .btn-control svg { width: 28px; height: 28px; }

    .btn-salto {
      width: 86px; height: 86px;
      border-color: #f59e0b;
      background: #3a2517e6;
    }
    .btn-salto.presionado, .btn-salto:active {
      background: #78350fe6;
      border-color: #fbbf24;
      transform: scale(0.94);
    }

    .btn-atacar {
      border-color: #f87171;
      background: #3b1818e6;
    }
    .btn-atacar .icono-accion {
      font-size: 26px;
      line-height: 1;
    }
    .btn-atacar.presionado, .btn-atacar:active {
      background: #7f1d1de6;
      border-color: #fca5a5;
      transform: scale(0.94);
    }

    .btn-gancho {
      border-color: #38bdf8;
      background: #172554e6;
    }
    .btn-gancho.apuntando, .btn-gancho.presionado, .btn-gancho:active {
      background: #0369a1;
      border-color: #7dd3fc;
      box-shadow: 0 0 16px #38bdf8, inset 0 2px 4px #bae6fd;
      transform: scale(0.94);
    }

    .btn-subir {
      border-color: #34d399;
      background: #064e3be6;
      animation: pulsoSubir 1.5s ease-in-out infinite;
    }
    @keyframes pulsoSubir {
      0%, 100% { box-shadow: 0 4px 12px #0006, 0 0 0 0 rgba(52, 211, 153, 0.5); }
      50% { box-shadow: 0 4px 12px #0006, 0 0 0 8px rgba(52, 211, 153, 0); }
    }
    .btn-subir.presionado, .btn-subir:active {
      background: #047857;
      transform: scale(0.94);
    }

    #btn-lanzagranadas { font-size: 10px; }
    .ayuda-teclado { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      font-size: 12px; background: #241c1cdb; color: #fff4dc; padding: 6px 12px; border-radius: 8px; }
    .aviso-orientacion { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 56px); left: 50%; transform: translateX(-50%);
      padding: 5px 12px; background: #241c1ced; font-size: 12px; z-index: 25; white-space: nowrap; border-radius: 8px; }

    /* Cartel grande y animado para mensajes */
    #aviso-viaje {
      position: absolute;
      z-index: 50;
      top: 16%;
      left: 50%;
      transform: translate(-50%, -24px) scale(0.92);
      max-width: min(92%, 720px);
      width: max-content;
      min-width: 260px;
      padding: 12px 24px;
      text-align: center;
      font-size: clamp(20px, 3.5vw, 30px);
      font-weight: 850;
      line-height: 1.35;
      letter-spacing: 0.5px;
      color: #fffbeb;
      background: linear-gradient(180deg, rgba(42, 28, 18, 0.96) 0%, rgba(20, 14, 10, 0.98) 100%);
      border: 3px solid #f59e0b;
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.85), inset 0 2px 4px rgba(254, 240, 138, 0.35);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
      pointer-events: none;
      box-sizing: border-box;
      word-break: break-word;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.28s;
    }
    #aviso-viaje.activo {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0) scale(1);
    }
    #aviso-viaje.saliendo {
      opacity: 0;
      visibility: visible;
      transform: translate(-50%, 16px) scale(0.94);
    }

    /* Celular en horizontal (844x390) */
    @media (max-height: 500px) {
      #aviso-viaje {
        font-size: 20px;
        padding: 8px 18px;
        top: 12%;
        border-width: 2.5px;
        border-radius: 14px;
      }
      .hud-superior {
        top: calc(env(safe-area-inset-top, 0px) + 6px);
        left: calc(env(safe-area-inset-left, 0px) + 10px);
        right: calc(env(safe-area-inset-right, 0px) + 10px);
        gap: 6px;
      }
      .retrato { width: 36px; height: 36px; }
      .barra-vida-contenedor { width: 76px; height: 8px; }
      .hud-pildora { padding: 3px 8px; font-size: 11px; }
      .hud-vida { padding-left: 3px; gap: 6px; }
      .icono-churu { width: 18px; height: 26px; }
      .joystick { width: 104px; height: 104px; }
      .joystick .palanca { width: 44px; height: 44px; left: calc(50% - 22px); top: calc(50% - 22px); }
      .btn-control { width: 62px; height: 62px; font-size: 10px; }
      .btn-control svg { width: 24px; height: 24px; }
      .btn-atacar .icono-accion { font-size: 22px; }
      .btn-salto { width: 72px; height: 72px; }
      .grupo-accion { gap: 8px; }
      .zona-controles {
        bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
        left: calc(env(safe-area-inset-left, 0px) + 10px);
        right: calc(env(safe-area-inset-right, 0px) + 10px);
      }
      .ayuda-teclado { display: none; }
    }

    /* Celular en vertical (390x844) */
    @media (max-width: 600px) {
      #aviso-viaje {
        font-size: 20px;
        padding: 10px 16px;
        top: calc(env(safe-area-inset-top, 0px) + 86px);
        max-width: 90%;
        border-width: 2.5px;
        border-radius: 14px;
      }
      .hud-superior {
        flex-wrap: nowrap;
        gap: 6px;
        left: calc(env(safe-area-inset-left, 0px) + 8px);
        right: calc(env(safe-area-inset-right, 0px) + 8px);
      }
      .hud-escena, #hud-traje, .label-churu, .texto-btn-menu { display: none; }
      .hud-pildora { padding: 4px 8px; font-size: 11px; }
      .hud-vida { padding-left: 3px; gap: 6px; }
      .retrato { width: 34px; height: 34px; }
      .barra-vida-contenedor { width: 60px; height: 8px; }
      .icono-churu { width: 18px; height: 26px; }
      #btn-menu { min-width: 40px; width: 40px; height: 40px; padding: 4px; justify-content: center; }
      #btn-pausa { min-width: 40px; width: 40px; height: 40px; padding: 6px; }
      .joystick { width: 116px; height: 116px; }
      .btn-control { width: 68px; height: 68px; font-size: 10px; }
      .btn-salto { width: 80px; height: 80px; }
      .grupo-accion { gap: 8px; }
    }
    /* En pantallas táctiles o pequeñas la ayuda del teclado estorba a los botones. */
    @media (pointer: coarse), (max-width: 700px), (max-height: 500px) { .ayuda-teclado { display: none; } }
</style>
</head>
<body>
  <div id="app">
    <!-- HUD Superior compacto -->
    <header class="hud-superior" aria-label="Indicadores del juego">
      <div class="hud-grupo-izq">
        <!-- Barra de vida visible y legible en móvil -->
        <div id="hud-vida" class="hud-pildora hud-vida" title="Salud de Senku" aria-label="Salud de Senku">
          <img class="retrato" src="./assets/personajes/menu_original.webp" alt="Senku">
          <div class="salud">
            <div class="barra-vida-contenedor" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" aria-label="Puntos de salud">
              <div id="barra-vida-relleno" class="barra-vida-relleno" style="width: 100%;"></div>
            </div>
            <small>♥ <span id="texto-vida" class="texto-vida">100</span> / <span id="texto-vida-max">100</span></small>
          </div>
        </div>
        <div class="hud-pildora" title="Saldo de Churus">
          <img class="icono-churu" src="./assets/objetos/churu.png" alt="">
          <span class="label-churu">Churus ×</span>
          <span id="saldo-churus">0</span>
        </div>
        <div class="hud-pildora hud-escena">
          <span id="nombre-escena">Taquería</span>
        </div>
      </div>
      <div class="hud-grupo-der">
        <button id="hud-traje" class="hud-pildora hud-btn hud-btn-traje" aria-label="Traje equipado" title="Clic o pulsa T para cambiar de traje">
          <span class="icono" aria-hidden="true">🐱</span>
          <span>Senku</span>
        </button>
        <button id="btn-menu" class="hud-pildora hud-btn hud-btn-menu" aria-label="Abrir menú de trajes" title="Abrir armario de trajes (M)">
          <span class="icono" aria-hidden="true">👗</span>
          <span class="texto-btn-menu">Armario</span>
        </button>
        <button id="btn-pausa" class="hud-pildora hud-btn" aria-label="Pausar y abrir menú" title="Pausa / Armario (M)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke-width="4"/></svg>
        </button>
      </div>
    </header>

    <!-- Aviso discreto de orientación vertical (no bloqueante) -->
    <div id="aviso-orientacion" class="aviso-orientacion" hidden aria-live="polite">
      <span>🔄 Gira el teléfono para jugar en horizontal</span>
    </div>

    <!-- Diálogo Modal del Menú de Trajes (Armario) -->
    <div id="modal-menu" class="modal-menu" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Menú de trajes de Senku">
      <div id="modal-menu-fondo" class="modal-menu-fondo" tabindex="-1"></div>
      <div class="modal-menu-contenido">
        <button id="btn-cerrar-menu" class="btn-cerrar-menu" aria-label="Cerrar menú de trajes" title="Cerrar menú (Esc)">✕</button>
        <div id="contenedor-menu"></div>
      </div>
    </div>

    <!-- Contenedor del Lienzo -->
    <main class="lienzo-envoltura">
      <canvas id="lienzo-juego" width="1280" height="720" role="img" aria-label="Pantalla de juego de Senku 2 en la Taquería"></canvas>
    </main>

    <p id="aviso-viaje" role="status" aria-live="polite" hidden></p>

    <!-- Ayuda para teclado (escritorio) -->
    <div class="ayuda-teclado">
      ◀ ▶ o A / D: Moverse · Espacio / ▲ / W: Saltar · J: Zarpazo · Shift / L: Desliz · K: Gancho · E: Subir · M: Menú · T: Traje
    </div>

    <!-- Controles Táctiles en Pantalla -->
    <nav class="zona-controles" aria-label="Controles táctiles">
      <div id="joystick" class="joystick" role="group" aria-label="Joystick táctil de ocho direcciones. Usa flechas o A y D con teclado.">
        <svg class="direccion-arriba" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        <svg class="direccion-abajo" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        <svg class="direccion-izquierda" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        <svg class="direccion-derecha" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        <span class="palanca"></span>
      </div>
      <div class="grupo-accion">
        <button id="btn-lanzagranadas" class="btn-control" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6V3h5l3 4M10 6h5M12 7c-8 0-9 14 0 14S20 7 12 7ZM6 13h12M7 17h10M12 8v12"/></svg>
          <span>Lanzagranadas</span>
        </button>
        <button id="btn-disparar" class="btn-control" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 8-8c3-3 6-2 6-2s1 3-2 6l-8 8ZM5 13l4 4-3 3-4-4ZM15 4l5 5"/></svg>
          <span>Disparar</span>
        </button>
        <button id="btn-gancho" class="btn-control btn-gancho" aria-label="Gancho: mantén para apuntar y suelta para disparar" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><path d="M12 7.5v6a3.5 3.5 0 0 0 7 0"/></svg>
          <span>Gancho</span>
        </button>
        <button id="btn-subir" class="btn-control btn-subir" aria-label="Subir a la camioneta" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11l7-7 7 7M12 4v16"/></svg>
          <span>Subir</span>
        </button>
        <button id="btn-atacar" class="btn-control btn-atacar" aria-label="Atacar / Zarpazo">
          <span class="icono-accion" aria-hidden="true">🐾</span>
          <span>Zarpazo</span>
        </button>
        <button id="btn-desliz" class="btn-control btn-desliz" aria-label="Desliz: esquiva rápida">
          <span class="icono-accion" aria-hidden="true">💨</span>
          <span>Desliz</span>
        </button>
        <button id="btn-salto" class="btn-control btn-salto" aria-label="Saltar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 8-8 8 8h-5v9H9v-9Z"/></svg>
          <span>Saltar</span>
        </button>
      </div>
    </nav>
  </div>

  <script>
    // Optimización de respuesta táctil inmediata para celular
    document.addEventListener('DOMContentLoaded', () => {
      const vincularBotonInmediato = (id) => {
        const el = document.getElementById(id);
        if (!el) return;
        // Un toque dispara pointerdown y touchstart: un solo clic por toque (si no, Pausa abre y cierra).
        let ultimo = -Infinity;
        const ejecutar = (e) => {
          if (e.cancelable && e.type !== 'pointerdown') e.preventDefault();
          const ahora = performance.now();
          if (ahora - ultimo < 400) return;
          ultimo = ahora;
          el.click();
        };
        el.addEventListener('pointerdown', (e) => {
          if (e.pointerType === 'touch' || e.pointerType === 'pen') ejecutar(e);
        }, { passive: true });
        el.addEventListener('touchstart', ejecutar, { passive: false });
      };
      vincularBotonInmediato('btn-subir');
      vincularBotonInmediato('btn-pausa');
      vincularBotonInmediato('btn-menu');
      vincularBotonInmediato('btn-cerrar-menu');
    });
  </script>

  <script type="module" src="./src/main.mjs"></script>
</body>
</html>
