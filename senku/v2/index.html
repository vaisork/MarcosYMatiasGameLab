<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Senku 2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1614">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="../../assets/icon/senku-icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="../../assets/icon/senku-icon-192.png">
  <title>Senku 2 — Taquería</title>
  <link rel="stylesheet" href="./src/ui/menu.css">
  <style>
    :root {
      --vh: 100vh;
      --app-height: 100vh;
      --app-width: 100vw;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: var(--app-height, 100vh);
      min-height: var(--app-height, 100vh);
      max-height: var(--app-height, 100vh);
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      background-color: #1a1614;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    #app {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: var(--app-height, 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 0;
    }

    .lienzo-envoltura {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #lienzo-juego {
      display: block;
      background-color: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      touch-action: none;
    }

    [hidden] { display: none !important; }
    button { font: inherit; cursor: pointer; color: #fff4dc; }
    button:focus-visible { outline: 3px solid #ffe3a0; outline-offset: 3px; }
    .hud-superior {
      position: absolute; z-index: 20;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: calc(env(safe-area-inset-left, 0px) + 16px);
      right: calc(env(safe-area-inset-right, 0px) + 16px);
      display: flex; align-items: center; gap: 10px; pointer-events: none;
    }
    .hud-pildora, .btn-control, .joystick {
      background: #241c1cdb; border: 2px solid #bdb0a0;
      box-shadow: 0 4px 12px #0006, inset 0 1px 2px #fff3;
    }
    .hud-pildora { display: flex; align-items: center; gap: 8px; padding: 6px 12px;
      border-radius: 12px; font-weight: 750; color: #fff4dc; }
    .hud-vida { padding: 4px 10px 4px 4px; gap: 10px; }
    .retrato { width: 48px; height: 48px; object-fit: cover; border-radius: 8px;
      image-rendering: pixelated; background: #392a24; }
    .salud { display: grid; gap: 4px; }
    .barra-vida-contenedor { width: 112px; height: 12px; border: 1px solid #f7dbb2;
      border-radius: 4px; overflow: hidden; background: #130e10; }
    .barra-vida-relleno { height: 100%; width: 100%; background: #22c55e; }
    .texto-vida { font-variant-numeric: tabular-nums; }
    .salud small { font-size: 12px; }
    .icono-churu { width: 28px; height: 40px; object-fit: contain; }
    .hud-escena { font-size: 12px; border: 0; box-shadow: none; background: #241c1cb8; }
    .hud-btn { pointer-events: auto; min-height: 44px; }
    #hud-traje { margin-left: auto; }
    #btn-pausa { width: 48px; height: 48px; padding: 10px; }
    svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .zona-controles { position: absolute; z-index: 30;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      left: calc(env(safe-area-inset-left, 0px) + 18px);
      right: calc(env(safe-area-inset-right, 0px) + 18px);
      display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
    .joystick { position: relative; width: 132px; height: 132px; border-radius: 50%;
      touch-action: none; pointer-events: auto; user-select: none; }
    .joystick .palanca { position: absolute; width: 54px; height: 54px; left: calc(50% - 27px);
      top: calc(50% - 27px); border-radius: 50%; background: #a7a0a1;
      border: 3px solid #e5d8cb; box-shadow: 0 3px 6px #0009;
      transform: translate(var(--palanca-x, 0px), var(--palanca-y, 0px)); pointer-events: none; }
    .joystick svg { position: absolute; width: 18px; height: 18px; opacity: .7; pointer-events: none; }
    .direccion-arriba { top: 7px; left: calc(50% - 9px); }
    .direccion-abajo { bottom: 7px; left: calc(50% - 9px); transform: rotate(180deg); }
    .direccion-izquierda { left: 7px; top: calc(50% - 9px); transform: rotate(-90deg); }
    .direccion-derecha { right: 7px; top: calc(50% - 9px); transform: rotate(90deg); }
    .grupo-accion { display: flex; align-items: flex-end; gap: 12px; }
    .btn-control { pointer-events: auto; touch-action: none; width: 84px; height: 84px;
      min-width: 44px; min-height: 44px; border-radius: 50%; display: flex;
      flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      font-size: 12px; font-weight: 750; }
    .btn-control svg { width: 32px; height: 32px; }
    .btn-salto { width: 96px; height: 96px; border-color: #f0cb8b; }
    #btn-lanzagranadas { font-size: 11px; }
    #btn-disparar { margin-bottom: 12px; }
    #btn-subir { width: 64px; height: 64px; }
    .btn-control:active, .hud-btn:active { background: #6d432b; }
    .ayuda-teclado { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      font-size: 12px; background: #241c1cdb; color: #fff4dc; padding: 6px 12px; border-radius: 8px; }
    .aviso-orientacion { position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
      padding: 6px 12px; background: #241c1ced; font-size: 12px; z-index: 25; white-space: nowrap; }
    @media (max-height: 500px) {
      .hud-superior { top: calc(env(safe-area-inset-top, 0px) + 8px); gap: 8px; }
      .retrato { width: 40px; height: 40px; }
      .barra-vida-contenedor { width: 90px; }
      .hud-pildora { padding: 4px 8px; }
      .hud-vida { padding-left: 4px; }
      .joystick { width: 112px; height: 112px; }
      .btn-control { width: 72px; height: 72px; }
      .btn-salto { width: 86px; height: 86px; }
      .ayuda-teclado { display: none; }
    }
    @media (max-width: 600px) {
      .hud-superior { flex-wrap: wrap; gap: 6px; left: calc(env(safe-area-inset-left, 0px) + 8px);
        right: calc(env(safe-area-inset-right, 0px) + 8px); }
      .hud-escena, #hud-traje { display: none; }
      #btn-menu { margin-left: auto; }
      .barra-vida-contenedor { width: 64px; }
      .grupo-accion { gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 180px; }
      .btn-control { width: 72px; height: 72px; }
      .btn-salto { width: 80px; height: 80px; }
    }
    @media (pointer: coarse) { .ayuda-teclado { display: none; } }
  </style>
</head>
<body>
  <div id="app">
    <!-- HUD Superior compacto -->
    <header class="hud-superior" aria-label="Indicadores del juego">
      <!-- Barra de vida visible y legible en móvil -->
      <div id="hud-vida" class="hud-pildora hud-vida" title="Salud de Senku" aria-label="Salud de Senku">
        <img class="retrato" src="./assets/personajes/menu_original.webp" alt="Senku"><div class="salud">
        <div class="barra-vida-contenedor" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" aria-label="Puntos de salud">
          <div id="barra-vida-relleno" class="barra-vida-relleno" style="width: 100%;"></div>
        </div>
        <small><span id="texto-vida" class="texto-vida">100</span> / 100 HP</small></div>
      </div>
      <div class="hud-pildora" title="Saldo de Churus">
        <img class="icono-churu" src="./assets/objetos/churu.png" alt=""><span>Churus ×</span>
        <span id="saldo-churus">0</span>
      </div>
      <div class="hud-pildora hud-escena">
        <span id="nombre-escena">Taquería</span>
      </div>
      <button id="hud-traje" class="hud-pildora hud-btn hud-btn-traje" aria-label="Traje equipado" title="Clic o pulsa T para cambiar de traje">
        <span class="icono" aria-hidden="true">🐱</span>
        <span>Senku</span>
      </button>
      <button id="btn-menu" class="hud-pildora hud-btn hud-btn-menu" aria-label="Abrir menú de trajes" title="Abrir armario de trajes (M)">
        <span class="icono" aria-hidden="true">👗</span>
        <span>Armario</span>
      </button>
      <button id="btn-pausa" class="hud-pildora hud-btn" aria-label="Pausar y abrir menú" title="Pausa / Armario (M)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke-width="4"/></svg>
      </button>
    </header>

    <!-- Aviso discreto de orientación vertical (no bloqueante) -->
    <div id="aviso-orientacion" class="aviso-orientacion" hidden aria-live="polite">
      <span>🔄 Gira el teléfono para jugar en horizontal</span>
    </div>

    <!-- Diálogo Modal del Menú de Trajes (Armario) -->
    <div id="modal-menu" class="modal-menu" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Menú de trajes de Senku">
      <div id="modal-menu-fondo" class="modal-menu-fondo" tabindex="-1"></div>
      <div class="modal-menu-contenido">
        <button id="btn-cerrar-menu" class="btn-cerrar-menu" aria-label="Cerrar menú de trajes" title="Cerrar menú (Esc)">✕</button>
        <div id="contenedor-menu"></div>
      </div>
    </div>

    <!-- Contenedor del Lienzo -->
    <main class="lienzo-envoltura">
      <canvas id="lienzo-juego" width="1280" height="720" role="img" aria-label="Pantalla de juego de Senku 2 en la Taquería"></canvas>
    </main>

    <p id="aviso-viaje" role="status" aria-live="polite" style="position:absolute;top:18%;left:5%;right:5%;text-align:center;color:white;background:#24180ddd;pointer-events:none" hidden></p>

    <!-- Ayuda para teclado (escritorio) -->
    <div class="ayuda-teclado">
      ◀ ▶ o A / D: Moverse · Espacio / ▲ / W: Saltar · E: Subir · M: Menú · T: Traje
    </div>

    <!-- Controles Táctiles en Pantalla -->
    <nav class="zona-controles" aria-label="Controles táctiles">
      <div id="joystick" class="joystick" role="group" aria-label="Joystick táctil de ocho direcciones. Usa flechas o A y D con teclado.">
        <svg class="direccion-arriba" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        <svg class="direccion-abajo" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        <svg class="direccion-izquierda" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        <svg class="direccion-derecha" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        <span class="palanca"></span>
      </div>
      <div class="grupo-accion">
        <button id="btn-lanzagranadas" class="btn-control" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6V3h5l3 4M10 6h5M12 7c-8 0-9 14 0 14S20 7 12 7ZM6 13h12M7 17h10M12 8v12"/></svg>
          <span>Lanzagranadas</span>
        </button>
        <button id="btn-disparar" class="btn-control" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 8-8c3-3 6-2 6-2s1 3-2 6l-8 8ZM5 13l4 4-3 3-4-4ZM15 4l5 5"/></svg>
          <span>Disparar</span>
        </button>
        <button id="btn-subir" class="btn-control" aria-label="Subir a la camioneta" hidden>Subir</button>
        <button id="btn-salto" class="btn-control btn-salto" aria-label="Saltar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 8-8 8 8h-5v9H9v-9Z"/></svg>
          <span>Saltar</span>
        </button>
      </div>
    </nav>
  </div>

  <script type="module" src="./src/main.mjs"></script>
</body>
</html>
