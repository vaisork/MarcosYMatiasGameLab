<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2d3561">
  <title>Bonus camión — Senku 2</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; height: 100dvh; margin: 0; overflow: hidden; background: #2d3561; color: #fff5df; font-family: system-ui, sans-serif; touch-action: none; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .hud { position: absolute; z-index: 2; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
    .card { border: 3px solid #6b4c3b; border-radius: 18px; padding: 8px 15px; background: #261f2eeF; box-shadow: 0 5px 0 #473129, 0 10px 24px #18121f88; text-shadow: 0 2px #1a1321; }
    .title { font-size: clamp(15px, 3vw, 26px); font-weight: 950; line-height: 1.05; }
    .label { font-size: 11px; font-weight: 800; color: #ffd485; letter-spacing: .1em; text-transform: uppercase; }
    .score { min-width: 104px; text-align: center; font-size: clamp(24px, 6vw, 46px); line-height: 1; font-weight: 1000; font-variant-numeric: tabular-nums; }
    .clock { min-width: 70px; text-align: center; font-size: clamp(24px, 5vw, 38px); line-height: 1; font-weight: 1000; font-variant-numeric: tabular-nums; }
    .score span { display: inline-block; color: #ffe26c; font-size: 1.18em; text-shadow: 0 3px #8f4e2d; }
    #reloj.urgente { color: #ff9c72; animation: pulso .55s ease-in-out infinite alternate; }
    @keyframes pulso { to { transform: scale(1.12); } }
    .fuel { position: absolute; z-index: 2; top: max(98px, calc(env(safe-area-inset-top) + 88px)); left: 50%; transform: translateX(-50%); width: min(210px, 38vw); height: 13px; border: 2px solid #6b4c3b; border-radius: 9px; overflow: hidden; background: #352a3d; }
    .fuel > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffd166, #ef476f); transition: width .15s; }
    .fuel-label { position: absolute; z-index: 2; top: max(114px, calc(env(safe-area-inset-top) + 104px)); left: 50%; transform: translateX(-50%); padding: 2px 8px; border: 1px solid #6b4c3b; border-radius: 0 0 8px 8px; background: #ffd485; font-size: 10px; font-weight: 900; color: #261f2e; white-space: nowrap; }
    .controls { position: absolute; z-index: 3; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
    .steering { display: flex; gap: 10px; }
    button { font: inherit; color: #fff4db; font-weight: 900; cursor: pointer; }
    .pad { width: clamp(66px, 15vw, 96px); height: clamp(66px, 15vw, 96px); border: 3px solid #ffdfa0; border-radius: 50%; background: #2b2236dd; box-shadow: 0 6px 0 #473129, 0 9px 18px #18121faa; font-size: clamp(24px, 6vw, 38px); pointer-events: auto; touch-action: none; }
    .pad:active { transform: translateY(4px); box-shadow: 0 2px 0 #473129; background: #5a4269; }
    .jump { width: clamp(84px, 20vw, 126px); height: clamp(84px, 20vw, 126px); font-size: clamp(15px, 3vw, 22px); background: #9e3d25; }
    .vidas { position:absolute; z-index:4; top:max(92px,calc(env(safe-area-inset-top) + 84px)); left:max(12px,env(safe-area-inset-left)); padding:2px 10px; border-radius:12px; background:#00000066; color:#ff5f6d; font-size:clamp(22px,5vw,30px); letter-spacing:2px; text-shadow:0 2px #3a1010; pointer-events:none; }
    #sonido { position: absolute; z-index: 4; top: max(92px, calc(env(safe-area-inset-top) + 84px)); right: max(12px, env(safe-area-inset-right)); padding: 6px 10px; border: 2px solid #6b4c3b; border-radius: 12px; background: #261f2edf; font-size: 12px; }
    #velo { position: absolute; z-index: 5; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at center, #211a3ad9, #13111dc4); backdrop-filter: blur(3px); text-align: center; text-shadow: 0 4px #3b241e; font-size: clamp(54px, 17vw, 128px); font-weight: 1000; color: #ffe57d; }
    #velo[hidden] { display: none; }
    #velo strong { max-width: 90vw; font-size: clamp(48px, 12vw, 112px); }
    #velo span { max-width: 90vw; font-size: clamp(18px, 4vw, 30px); color: white; text-shadow: 0 2px #222; }
    #velo > strong:not(:first-child) { font-size: clamp(32px, 8vw, 72px); }
    #velo button { pointer-events: auto; padding: 14px 24px; border: 3px solid #ffdfa0; border-radius: 18px; background: #9e3d25; box-shadow: 0 5px #473129; font-size: clamp(17px, 4vw, 24px); }
    .help { position: absolute; z-index: 2; bottom: max(120px, calc(env(safe-area-inset-bottom) + 120px)); left: 50%; transform: translateX(-50%); width: max-content; max-width: 92vw; padding: 7px 12px; border-radius: 12px; background: #261f2eb8; text-align: center; font-size: clamp(11px, 2.5vw, 14px); font-weight: 750; }
    @media (min-width: 700px) { .help { bottom: 24px; } .controls { display: none; } .fuel { top: 100px; } .fuel-label { top: 116px; } }
  </style>
</head>
<body>
  <canvas role="img" aria-label="Bonus del camión por la ciudad"></canvas>
  <header class="hud">
    <div class="card"><div class="label">Senku 2 · Bonus</div><div class="title">Camión en la ciudad</div></div>
    <div class="card score"><div class="label">Churus</div><span id="marcador">00</span><small style="font-size:.55em"> / 30</small></div>
    <div class="card clock"><div class="label">Tiempo</div><span id="reloj">30</span><small style="font-size:.48em"> s</small></div>
  </header>
  <div class="fuel"><i id="combustible"></i></div><div class="fuel-label">CAJAS Y TECHO DEL CAMIÓN</div>
  <div class="vidas" aria-label="Corazones del bonus"><span id="corazones">♥♥♥</span></div>
  <button id="sonido" type="button">Sonido</button>
  <div class="help">A / D o ← / → para cajas y techo · Espacio / W / ↑ para saltar letreros, ramas y cables</div>
  <nav class="controls" aria-label="Controles táctiles">
    <div class="steering"><button class="pad" data-control="izquierda" aria-label="Ir a las cajas traseras">◀</button><button class="pad" data-control="derecha" aria-label="Subir hacia el techo del camión">▶</button></div>
    <button class="pad jump" data-control="salto" aria-label="Saltar sobre cajas, letreros, ramas y cables">¡SALTA!</button>
  </nav>
  <div id="velo">3</div>
  <script type="module">
    import { iniciarBonus } from './src/bonus_camion.mjs';
    window.__bonusCamion = iniciarBonus(document, window);
  </script>
</body>
</html>
