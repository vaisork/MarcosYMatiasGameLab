late(-50%,0)}@media(pointer:fine){.controls{opacity:.3}.btn{width:58px;height:58px}.jump,.action{width:65px;height:65px}}

<script>
(()=> {
const c=document.getElementById('game'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const W=c.width,H=c.height;
const zone=document.getElementById('zone'),objective=document.getElementById('objective'),count=document.getElementById('count'),action=document.getElementById('action'),toast=document.getElementById('toast');
const intro=document.getElementById('intro'),modal=document.getElementById('modal'),mt=document.getElementById('mt'),ms=document.getElementById('ms'),mc=document.getElementById('mc'),mb=document.getElementById('mb');
const skins=document.getElementById('skins'),wardrobe=document.getElementById('wardrobe'),closeSkins=document.getElementById('closeSkins'),introWardrobe=document.getElementById('introWardrobe'),skinPreview=document.getElementById('skinPreview'),previewBadge=document.getElementById('previewBadge');
const previewImg=skinPreview.querySelector('img'),basePreviewSrc='../../assets/senku/menu-base.jpg?v=050',secretPreviewSrc='../../assets/trajes/rata/menu.webp?v=050';
let scene='house',running=false,last=performance.now(),time=0,modalAction=null,busTimer=null,near=null,wardrobeWasRunning=false;
let churus=0,secret=false,ratPeekShown=false;
let storageAvailable=true;
function storageGet(key){
 if(!storageAvailable)return null;
 try{return window.localStorage.getItem(key)}catch(err){storageAvailable=false;console.warn('Senku: almacenamiento local no disponible; la partida continuará sin persistencia.',err);return null}
}
function storageSet(key,value){
 if(!storageAvailable)return false;
 try{window.localStorage.setItem(key,value);return true}catch(err){storageAvailable=false;console.warn('Senku: no se pudo guardar la partida; se continuará sin persistencia.',err);return false}
}
let selectedSkin=storageGet('senku_skin')||'normal';
let collected=new Set();
const senkuSheet=new Image();senkuSheet.src='../../assets/senku/senku-sprites.png?v=050';
const secretRatSheet=new Image();secretRatSheet.src='../../assets/trajes/rata/walk-sheet.png?v=050';
const ratSheet=new Image();ratSheet.src='../../assets/rata/white-rat-sprite-v2.png?v=051';
const dogStand=new Image();dogStand.src='../../assets/perro/dog-standing.png?v=052';
const dogCrouch=new Image();dogCrouch.src='../../assets/perro/dog-crouched.png?v=052';
const spriteBuffer=document.createElement('canvas');spriteBuffer.width=72;spriteBuffer.height=72;const sx=spriteBuffer.getContext('2d');sx.imageSmoothingEnabled=false;
const keys={l:false,r:false,j:false,a:false};let jl=false,al=false;
const p={x:85,y:430,w:54,h:44,vx:0,vy:0,ground:false,face:1,anim:0,speed:330,jump:575};
let items=[];
let cupX=465,cupY=384,cupVy=0,cupKnocked=false;
const info={house:['Casa','Encuentra una salida'],street:['Calle','Explora la calle'],bus:['Autobús','Viaja de polizón'],taco:['Taquería','Investiga el lugar']};

function hud(){zone.textContent=info[scene][0];objective.textContent=info[scene][1];count.textContent=churus;renderWardrobe()}
function save(){storageSet('senku_churus',churus);storageSet('senku_skin',selectedSkin);if(secret)storageSet('senku_secret','1');storageSet('senku_collected',JSON.stringify([...collected]))}
function renderWardrobe(){
 if(selectedSkin==='secret'&&!secret)selectedSkin='normal';
 if(selectedSkin==='gold'&&churus<300)selectedSkin='normal';
 document.querySelectorAll('.skinCard[data-skin]').forEach(b=>{
   const k=b.dataset.skin,locked=(k==='secret'&&!secret)||(k==='gold'&&churus<300);
   b.classList.toggle('locked',locked);b.classList.toggle('selected',k===selectedSkin);
 });
 skinPreview.classList.toggle('secret',selectedSkin==='secret');
 skinPreview.classList.toggle('gold',selectedSkin==='gold');
 previewImg.src=selectedSkin==='secret'?secretPreviewSrc:basePreviewSrc;
 previewBadge.textContent=selectedSkin==='secret'?'Traje secreto de la rata':selectedSkin==='gold'?'Gato dorado · 300 Churus':'Traje inicial';
}
function openWardrobe(){wardrobeWasRunning=running;running=false;renderWardrobe();skins.classList.remove('hidden')}
function closeWardrobe(){skins.classList.add('hidden');running=wardrobeWasRunning}
wardrobe.onclick=openWardrobe;introWardrobe.onclick=openWardrobe;closeSkins.onclick=closeWardrobe;
document.querySelectorAll('.skinCard[data-skin]').forEach(b=>b.onclick=()=>{
 const k=b.dataset.skin;if(k==='secret'&&!secret){say('Encuentra a la rata escondida en la taquería 🐀',1700);return}
 if(k==='gold'&&churus<300){say('Necesitas 300 Churus para el gato dorado ✨',1700);return}
 selectedSkin=k;save();renderWardrobe();say('Traje seleccionado',700)
});
function say(m,ms=1500){toast.textContent=m;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),ms)}
function show(a,b,d,button='CONTINUAR',fn=null){running=false;mt.textContent=a;ms.textContent=b;mc.textContent=d;mb.textContent=button;modalAction=fn;modal.classList.remove('hidden')}
mb.onclick=()=>{modal.classList.add('hidden');const f=modalAction;modalAction=null;if(f)f();running=true};

function setScene(s){
 if(s==='taco'&&!/[?&]legacy=1/.test(location.search)){save();location.href='../v2/index.html';return}
 scene=s;near=null;action.style.display='none';if(busTimer){clearTimeout(busTimer);busTimer=null}
 if(s==='house'){p.x=85;p.y=430;items=[];cupX=465;cupY=384;cupVy=0;cupKnocked=false}
 if(s==='street'){p.x=50;p.y=430;items=[{id:'street-0',x:190,y:430},{id:'street-1',x:330,y:360},{id:'street-2',x:520,y:430},{id:'street-3',x:720,y:374}].map(q=>({...q,t:collected.has(q.id)?1:0}))}
 if(s==='bus'){p.x=170;p.y=430;items=[{id:'bus-0',x:110,y:430},{id:'bus-1',x:154,y:430},{id:'bus-2',x:198,y:430},{id:'bus-3',x:242,y:430},{id:'bus-4',x:286,y:430},{id:'bus-5',x:330,y:430},{id:'bus-6',x:374,y:430},{id:'bus-7',x:418,y:430},{id:'bus-8',x:462,y:430},{id:'bus-9',x:506,y:430},{id:'bus-10',x:550,y:430},{id:'bus-11',x:594,y:430},{id:'bus-12',x:638,y:430},{id:'bus-13',x:682,y:430},{id:'bus-14',x:726,y:430},{id:'bus-15',x:770,y:430},{id:'bus-16',x:814,y:430},{id:'bus-17',x:858,y:430},{id:'bus-18',x:902,y:430},{id:'bus-19',x:946,y:430}].map(q=>({...q,t:collected.has(q.id)?1:0}))}
 if(s==='taco'){p.x=60;p.y=430;items=[{id:'taco-0',x:230,y:430},{id:'taco-1',x:580,y:430},{id:'taco-2',x:744,y:355}].map(q=>({...q,t:collected.has(q.id)?1:0}))}
 p.vx=p.vy=0;hud()
}
window.setScene=setScene;
function hold(id,k){const e=document.getElementById(id),on=q=>{q.preventDefault();keys[k]=true},off=q=>{q.preventDefault();keys[k]=false};e.addEventListener('pointerdown',on);e.addEventListener('pointerup',off);e.addEventListener('pointercancel',off);e.addEventListener('pointerleave',off)}
hold('left','l');hold('right','r');hold('jump','j');hold('action','a');
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=true;if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW'){keys.j=true;e.preventDefault()}if(e.code==='KeyE'||e.code==='Enter')keys.a=true});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=false;if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW')keys.j=false;if(e.code==='KeyE'||e.code==='Enter')keys.a=false});
document.getElementById('start').onclick=()=>{intro.classList.add('hidden');setScene('house');running=true;say('Senku v0.5.9 · arranque resistente 🐾',1800)};

function platforms(){
 if(scene==='house')return[{x:0,y:504,w:W,h:115},{x:100,y:430,w:190,h:74},{x:380,y:400,w:170,h:20},{x:680,y:345,w:135,h:159},{x:878,y:278,w:88,h:20}];
 if(scene==='street')return[{x:0,y:505,w:W,h:114},{x:280,y:420,w:125,h:85},{x:475,y:455,w:100,h:50},{x:685,y:408,w:105,h:97}];
 if(scene==='bus')return[{x:0,y:505,w:W,h:114},{x:250,y:440,w:150,h:65},{x:585,y:440,w:150,h:65}];
 return[{x:0,y:505,w:W,h:114},{x:645,y:422,w:120,h:83}]
}
function physics(dt){
 const dir=(keys.r?1:0)-(keys.l?1:0),target=dir*p.speed;p.vx+=(target-p.vx)*Math.min(1,dt*10);if(dir)p.face=dir;
 if(keys.j&&!jl&&p.ground){p.vy=-p.jump;p.ground=false}jl=keys.j;p.vy+=1500*dt;p.x+=p.vx*dt;p.x=Math.max(3,Math.min(W-p.w-3,p.x));
 const old=p.y;p.y+=p.vy*dt;p.ground=false;
 for(const q of platforms())if(p.x+p.w>q.x&&p.x<q.x+q.w&&old+p.h<=q.y+7&&p.y+p.h>=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.ground=true}
 if(p.y>H+80){p.x=50;p.y=380;p.vy=0}p.anim+=dt
}
function collect(){for(const q of items)if(!q.t&&Math.hypot(p.x+27-q.x,p.y+18-q.y)<35){q.t=1;collected.add(q.id);churus++;save();hud();say('+1 Churu 🧃',700)}}
function ratOut(){return secret||(time%5)<2}
function interaction(){
 near=null;action.style.display='none';const px=p.x+27,py=p.y+18;
 if(scene==='house'&&Math.hypot(px-918,py-250)<95)near='window';
 if(scene==='street'){if(Math.hypot(px-530,py-430)<80)near='box';else if(Math.hypot(px-820,py-420)<90)near='dog';else if(px>990)near='bus'}
 if(scene==='taco'){
   const out=ratOut();
   if(out&&!ratPeekShown&&!secret){ratPeekShown=true;say('¡Psst, ahí está! 🐀',1100)}
   if(!out)ratPeekShown=false;
   if(out&&Math.hypot(px-875,py-440)<100)near='rat';
 }
 if(near){action.style.display='block';action.textContent=near==='bus'?'🚌':near==='window'?'⬆️':near==='box'?'🔎':'💬'}
 if(keys.a&&!al&&near)act();al=keys.a
}
function act(){
 if(near==='window')show('CAPÍTULO 1','México','Senku logra salir de casa. Ahora toca investigar la calle.','SALIR',()=>setScene('street'));
 if(near==='box'){if(!collected.has('street-box')){collected.add('street-box');churus+=3;save();hud();say('+3 Churus secretos 🧃🧃🧃',1800)}else say('La caja ya está vacía.',1200);p.x=620}
 if(near==='dog')show('PERRO DE LA BANQUETA','Una pista','“Ese autobús huele a comida, pero el conductor no parece amar a los animales.”','ENTENDIDO');
 if(near==='bus')show('AUTOBÚS','Viaje gratis','Senku sube sin boleto. ¡Alguien tiró una bolsa de Churus adentro!','SUBIR',()=>{setScene('bus');say('¡Junta los que puedas antes de que te bajen! 🧃',1600);busTimer=setTimeout(()=>{if(scene!=='bus')return;show('¡FUERA, GATO!','2 segundos después…','El conductor descubre a Senku y lo baja en la siguiente parada.','CAER DE PIE',()=>setScene('taco'))},2000)});
 if(near==='rat'){if(!secret){secret=true;save();hud();show('RATA ESCONDIDA','Traje exclusivo','“Psst… toma este traje. Te ayudará a pasar desapercibido.”','RECIBIR',()=>say('¡Traje secreto desbloqueado! 🧣',1800))}else say('La rata ya te dio su traje.')}
}
function update(dt){if(!running)return;physics(dt);collect();interaction();bumpCup();fallCup(dt)}
function bumpCup(){if(scene!=='house'||cupKnocked)return;if(Math.hypot(p.x+27-cupX,p.y+18-cupY)<48){cupKnocked=true;cupX=566}}
function fallCup(dt){if(scene!=='house'||!cupKnocked||cupY>=488)return;cupVy+=1500*dt;cupY=Math.min(488,cupY+cupVy*dt);if(cupY>=488)cupVy=0}

function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function drawChuru(q){if(q.t)return;x.save();x.translate(q.x,q.y+Math.sin(time*4+q.x)*4);x.fillStyle='#edc45a';rr(-9,-19,18,33,5);x.fill();x.fillStyle='#9d5938';x.fillRect(-6,-13,12,12);x.restore()}
function pix(gx,gy,s,col){x.fillStyle=col;x.fillRect(gx*s,gy*s,s,s)}
function fillPix(grid,x0,y0,w,h,code){
 for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
  const gx=x0+xx,gy=y0+yy;
  if(gy>=0&&gy<grid.length&&gx>=0&&gx<grid[0].length)grid[gy][gx]=code
 }
}
function putPix(grid,pts,code){for(const [gx,gy] of pts)if(gy>=0&&gy<grid.length&&gx>=0&&gx<grid[0].length)grid[gy][gx]=code}
function senku(){
 const moving=Math.abs(p.vx)>18&&p.ground;
 const bob=moving?Math.sin(p.anim*18)*2:Math.sin(p.anim*3)*.8;
 if(selectedSkin==='secret'&&secretRatSheet.complete&&secretRatSheet.naturalWidth){
   let frame=0;
   if(!p.ground)frame=p.vy<-180?2:p.vy<120?3:4;
   else if(moving)frame=Math.floor(p.anim*10)%7;
   const sw=96,sh=72,dw=132,dh=99,dx=Math.round(p.x+p.w/2-dw/2),dy=Math.round(p.y+p.h-dh+12+bob);
   x.save();x.imageSmoothingEnabled=false;
   if(p.face<0){x.translate(dx+dw,0);x.scale(-1,1);x.drawImage(secretRatSheet,frame*sw,0,sw,sh,0,dy,dw,dh)}
   else x.drawImage(secretRatSheet,frame*sw,0,sw,sh,dx,dy,dw,dh);
   x.restore();return;
 }
 let frame=0,row=0;
 if(!p.ground){row=1;frame=p.vy<-220?0:p.vy<-40?1:p.vy<220?2:3}
 else if(moving){frame=Math.floor(p.anim*9)%4}
 const dw=118,dh=118,dx=Math.round(p.x+p.w/2-dw/2),dy=Math.round(p.y+p.h-dh+13+bob);
 if(!senkuSheet.complete||!senkuSheet.naturalWidth){x.fillStyle='#d8bb91';x.fillRect(p.x,p.y,p.w,p.h);return}
 sx.clearRect(0,0,72,72);sx.globalCompositeOperation='source-over';sx.globalAlpha=1;
 sx.drawImage(senkuSheet,frame*72,row*72,72,72,0,0,72,72);
 if(selectedSkin==='gold'){sx.globalCompositeOperation='source-atop';sx.globalAlpha=.58;sx.fillStyle='#f3bf3f';sx.fillRect(0,0,72,72);sx.globalCompositeOperation='source-over';sx.globalAlpha=1}
 x.save();x.imageSmoothingEnabled=false;
 if(p.face<0){x.translate(dx+dw,0);x.scale(-1,1);x.drawImage(spriteBuffer,0,0,72,72,0,dy,dw,dh)}
 else x.drawImage(spriteBuffer,0,0,72,72,dx,dy,dw,dh);
 x.restore();
}

 const stripeColors=['#c94f3c','#f3efe1'];for(let i=0;i<12;i++){x.fillStyle=stripeColors[i%2];x.fillRect(258+i*32,252,32,26)}

 x.fillStyle='#7fae5c';x.beginPath();x.arc(886,442,8,0,Math.PI*2);x.fill();
 x.fillStyle='#695149';x.fillRect(0,505,W,114)
}
function draw(){time+=1/60;x.clearRect(0,0,W,H);if(scene==='house')house();if(scene==='street')street();if(scene==='bus')bus();if(scene==='taco')taco();items.forEach(drawChuru);senku()}
function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;update(dt);draw();requestAnimationFrame(loop)}
hud();requestAnimationFrame(loop)
})();
