<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#192b25"><title>Vaisgard RPG</title><link rel="stylesheet" href="/client-rpg/rpg.css"><script src="/client-rpg/rpg.js" defer></script></head>
<body><header><h1>Vaisgard</h1><div class="header-tools"><a href="/" class="portal-link">Portal</a><button id="logout" type="button" class="portal-btn" hidden>Salir</button></div></header>
<main><section id="entry" class="frame entry-card" hidden aria-label="Acceso a Vaisgard RPG"></section>
<section id="world-view" class="world" aria-label="Juego"><div class="hud"><div><strong id="place">Preparando el camino…</strong><div id="identity"></div></div><button id="pause" aria-label="Abrir menú">Menú</button></div>
<div class="screen"><canvas id="world" width="640" height="480" tabindex="0" aria-label="Escenario. Flechas o WASD para caminar. Z o Enter para A; X o Escape para B."></canvas><div id="combat" hidden></div><div id="outcome" hidden></div></div>
<div id="dialogue" class="frame"><div class="dialogue-head"><strong id="speaker">El camino</strong><span id="turn"></span></div><button id="advance" aria-label="Avanzar narración"><span id="line">Conectando con Vaisgard…</span><small id="more">A · continuar</small></button></div>
<p id="notice" role="status" aria-live="polite"></p><div id="battle-menu" hidden></div>
<div class="controls"><div class="pad" aria-label="Movimiento"><button data-key="ArrowUp" aria-label="Caminar al norte">↑</button><button data-key="ArrowLeft" aria-label="Caminar al oeste">←</button><button data-key="ArrowDown" aria-label="Caminar al sur">↓</button><button data-key="ArrowRight" aria-label="Caminar al este">→</button></div><div class="ab"><button id="back" aria-label="B: volver">B</button><button id="interact" aria-label="A: interactuar">A</button></div></div><p class="hint">Flechas / WASD · Z / Enter: A · X / Esc: B</p></section>
<aside id="panel" hidden class="frame"><div class="dialogue-head"><h2 id="action-title">Decisiones</h2><button id="close-panel">Cerrar · B</button></div><p id="description"></p><div id="contexts"></div><div id="actions"></div><div class="panel-account-tools"><button id="panel-select-char" type="button">Elegir personaje</button><button id="panel-logout" type="button">Cerrar sesión</button></div><details><summary>Historial del relato</summary><div id="narrative"></div></details></aside></main></body></html>
