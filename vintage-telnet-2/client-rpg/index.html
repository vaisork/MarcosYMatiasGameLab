<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070d16">
  <title>Vaisgard RPG</title>
  <link rel="stylesheet" href="/client-rpg/rpg.css">
  <script src="/client-rpg/rpg.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <span class="brand-crest" aria-hidden="true">
        <svg class="svg-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 0L10 6L16 8L10 10L8 16L6 10L0 8L6 6Z" fill="currentColor"/></svg>
      </span>
      <h1 class="brand-title">Vaisgard</h1>
    </div>
    <div class="header-tools">
      <button id="logout" type="button" class="portal-btn" hidden>Salir</button>
    </div>
  </header>

  <main>
    <!-- Pantalla Inicial Ilustrada (Entrada / Acceso / Personaje) -->
    <section id="entry" class="frame entry-card" hidden aria-label="Acceso a Vaisgard RPG"></section>

    <!-- Exploración Inmersiva a Pantalla Completa & Combate Teatral -->
    <section id="world-view" class="world" aria-label="Juego">
      <!-- HUD Flotante Superior -->
      <div class="hud" id="hud">
        <div class="hud-player">
          <div class="hud-avatar-frame" id="player-portrait" title="Retrato del personaje" aria-label="Retrato del personaje"></div>
          <div class="hud-player-meta">
            <div class="hud-name-row">
              <strong id="char-name" class="hud-name">Héroe</strong>
              <span id="char-level" class="hud-level">Nv. 1</span>
            </div>
            <div class="hud-hp-bar" title="Puntos de Vida">
              <div class="hud-hp-fill" id="hp-bar-fill"></div>
            </div>
            <span class="hud-hp-val" id="hp-bar-text"></span>
            <div id="identity" class="hud-sub-stats"></div>
          </div>
        </div>

        <div class="hud-center">
          <div class="hud-place-badge">
            <span class="hud-place-icon" aria-hidden="true">
              <svg class="svg-icon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 1a4.5 4.5 0 00-4.5 4.5c0 3.5 4.5 9.5 4.5 9.5s4.5-6 4.5-9.5A4.5 4.5 0 008 1zm0 6a1.5 1.5 0 110-3 1.5 1.5 0 010 3z" fill="currentColor"/></svg>
            </span>
            <strong id="place">Preparando el camino…</strong>
          </div>
        </div>

        <div class="hud-right">
          <div class="hud-minimap-card" id="minimap-card" title="Sala actual">
            <div class="minimap-tag">
              <span class="minimap-compass" aria-hidden="true">
                <svg class="svg-icon" viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><path d="M8 1l3 6-3-2-3 2 3-6zm0 14l-3-6 3 2 3-2-3 6z" fill="currentColor"/></svg>
              </span>
              <span class="minimap-dir">N</span>
              <span id="minimap-room-name" class="minimap-name">Sala actual</span>
            </div>
            <div class="minimap-canvas-wrap">
              <canvas id="minimap-canvas" width="48" height="36" aria-hidden="true"></canvas>
            </div>
          </div>
          <button id="pause" class="hud-menu-btn" type="button" aria-label="Abrir menú">
            <span class="btn-menu-bars" aria-hidden="true">
              <svg class="svg-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 3h12v2H2V3zm0 4h12v2H2V7zm0 4h12v2H2v-2z" fill="currentColor"/></svg>
            </span>
            <span class="btn-menu-label">Menú</span>
          </button>
        </div>
      </div>

      <!-- Pantalla de Escenario Responsive con Cámara -->
      <div class="screen">
        <canvas id="world" width="640" height="480" tabindex="0" aria-label="Escenario. Flechas o WASD para caminar. Z o Enter para A; X o Escape para B."></canvas>
        <div id="combat" hidden></div>
        <section id="enemy-hud" class="frame" hidden aria-label="Adversario">
          <div class="enemy-heading"><strong id="enemy-name"></strong><span id="enemy-level"></span></div>
          <progress id="enemy-health" aria-label="Vida del adversario" max="1" value="1"></progress>
          <span id="enemy-health-text"></span>
        </section>
        <div id="outcome" hidden></div>
      </div>

      <!-- Panel Flotante Compacto de Narrativa y Diálogo Expandible -->
      <div id="dialogue" class="frame dialogue-compact">
        <div class="dialogue-head">
          <div class="dialogue-speaker-wrap">
            <span class="speaker-scroll" aria-hidden="true">
              <svg class="svg-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3 2h8a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V4a2 2 0 011-1.7V10a1 1 0 002 0V2zm2 3v1h5V5H5zm0 3v1h5V8H5z" fill="currentColor"/></svg>
            </span>
            <strong id="speaker">El camino</strong>
          </div>
          <div class="dialogue-head-tools">
            <span id="turn" class="round-timer-badge"></span>
            <button id="toggle-dialogue" type="button" class="btn-dialogue-expand" aria-label="Expandir relato completo" title="Expandir relato completo">
              <svg class="svg-icon icon-expand-svg" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2 2h5v2H4v3H2V2zm9 0h5v5h-2V4h-3V2zM2 14v-5h2v3h3v2H2zm12 0h-5v-2h3v-3h2v5z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <button id="advance" type="button" aria-label="Avanzar narración">
          <span id="line">Conectando con Vaisgard…</span>
          <small id="more">A · continuar</small>
        </button>
        <div id="dialogue-full" class="dialogue-full-scroll" hidden>
          <div id="dialogue-full-text"></div>
        </div>
      </div>

      <p id="notice" role="status" aria-live="polite"></p>

      <!-- Tarjetas de Combate Semánticas -->
      <div id="battle-menu" hidden></div>

      <!-- Barra de Navegación Inferior (6 celdas proporcionales) -->
      <nav id="menu-bar" aria-label="Decisiones del juego"></nav>

      <!-- Controles Móviles Integrados -->
      <div class="controls">
        <div class="pad-wrap">
          <div class="pad" aria-label="Movimiento">
            <button data-key="ArrowUp" class="dpad-key dpad-up" aria-label="Caminar al norte">
              <svg class="svg-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3l5 7H3z" fill="currentColor"/></svg>
            </button>
            <button data-key="ArrowLeft" class="dpad-key dpad-left" aria-label="Caminar al oeste">
              <svg class="svg-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 8l7-5v10z" fill="currentColor"/></svg>
            </button>
            <div class="dpad-center" aria-hidden="true">
              <svg class="svg-icon" viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><path d="M8 2l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="currentColor"/></svg>
            </div>
            <button data-key="ArrowRight" class="dpad-key dpad-right" aria-label="Caminar al este">
              <svg class="svg-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13 8l-7 5V3z" fill="currentColor"/></svg>
            </button>
            <button data-key="ArrowDown" class="dpad-key dpad-down" aria-label="Caminar al sur">
              <svg class="svg-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 13l-5-7h10z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <div class="ab">
          <button id="back" class="btn-circle btn-b" type="button" aria-label="B: volver">
            <span class="circle-letter">B</span>
          </button>
          <button id="interact" class="btn-circle btn-a" type="button" aria-label="A: interactuar">
            <span class="circle-letter">A</span>
          </button>
        </div>
      </div>

      <p class="hint">Flechas / WASD · Z / Enter: A · X / Esc: B</p>
    </section>

    <!-- Panel Deslizante para Decisiones, Menús e Inventario -->
    <aside id="panel" hidden class="frame drawer-panel">
      <div class="dialogue-head drawer-head">
        <h2 id="action-title">Decisiones</h2>
        <button id="close-panel" type="button">Volver · B</button>
      </div>
      <p id="description"></p>
      <div id="contexts"></div>
      <div id="actions"></div>
      <div class="panel-account-tools">
        <button id="panel-select-char" type="button">Elegir personaje</button>
        <button id="panel-logout" type="button">Cerrar sesión</button>
      </div>
      <details>
        <summary>Historial del relato</summary>
        <div id="narrative"></div>
      </details>
    </aside>
  </main>
</body>
</html>
