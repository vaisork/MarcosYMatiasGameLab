<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#192c21">
  <title>Guerra de Clanes</title>
  <link rel="stylesheet" href="./assets/battlefield.css">
</head>
<body>
  <div id="world" aria-label="Mapa 3D de Guerra de Clanes"></div><div id="fps" class="fps" hidden></div>
  <main class="hud">
    <div class="row top">
      <section class="card identity">
        <h1>Guerra de Clanes</h1>
        <div class="match">
          <span class="clan dosel"><svg aria-hidden="true"><use href="./assets/emblems.svg#dosel"/></svg>Dosel</span>
          <span class="versus">contra</span>
          <span class="clan forja"><svg aria-hidden="true"><use href="./assets/emblems.svg#forja"/></svg>Forja Errante</span>
        </div>
        <p class="battle-meta">Nimbora <span>·</span> Paseo <span>·</span> <span class="seed">semilla <span id="seed">917</span></span></p>
      </section>
      <section class="card stats" aria-label="Recursos y población">
        <div class="stat brote"><svg aria-hidden="true"><use href="./assets/emblems.svg#brote"/></svg><span>Brote<strong id="brote">0</strong></span></div>
        <div class="stat prisma"><svg aria-hidden="true"><use href="./assets/emblems.svg#prisma"/></svg><span>Prisma<strong id="prisma">0</strong></span></div>
        <div class="stat poblacion"><svg aria-hidden="true"><use href="./assets/emblems.svg#poblacion"/></svg><span>Población<strong id="population">0 / 0</strong></span></div>
      </section>
    </div>
    <div class="notice" id="notice" role="status"></div>
    <div class="row bottom">
      <section class="card panel">
        <div class="title" id="selection">Sin selección</div><div class="bar context" id="actions"></div>
        <div class="title" id="build-heading" hidden>Edificios</div><div class="bar builds" id="buildings" hidden></div>
        <div class="title" id="production-heading" hidden>Producción</div><div class="queue queue-line" id="queue-line" hidden><span id="queue">Cola vacía</span></div><div class="bar builds" id="units" hidden></div><div class="bar builds" id="heroes" hidden></div>
      </section>
      <aside class="card navigator" aria-label="Mapa y controles">
        <div class="minimap"><h2><svg aria-hidden="true"><use href="./assets/emblems.svg#brujula"/></svg> Mapa</h2><div id="minimap"></div></div>
        <div class="navigator-controls">
          <div class="groups" aria-label="Grupos"><button data-group="1" aria-label="Grupo 1">1</button><button data-group="2" aria-label="Grupo 2">2</button><button data-group="3" aria-label="Grupo 3">3</button><button data-group="4" aria-label="Grupo 4">4</button></div>
          <div class="camera-tools"><button id="home" aria-label="Inicio" title="Centrar en tu base"><svg aria-hidden="true"><use href="./assets/emblems.svg#inicio"/></svg><span>Inicio</span></button><button id="pause" aria-label="Pausa" title="Pausar partida"><svg aria-hidden="true"><use href="./assets/emblems.svg#pausa"/></svg><span>Pausa</span></button></div>
          <p class="input-note"><span class="desktop-hint">Rueda: zoom · arrastra: cámara · clic derecho: orden</span><span class="touch-hint">Pellizca: zoom · arrastra: cámara</span></p>
        </div>
      </aside>
    </div>
  </main>
  <script type="module" src="./src/app/main.mjs"></script>
</body>
</html>
