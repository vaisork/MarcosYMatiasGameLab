<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#24443a">
  <title>Guerra de Clanes</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17251e;color:#fff8dc;font:16px/1.3 system-ui,sans-serif;touch-action:none}#world,canvas{display:block;width:100%;height:100%}button{min-height:44px;min-width:44px;padding:6px 10px;border:2px solid #d0dda7;border-radius:11px;background:#233f38;color:#fff8dc;font:700 15px system-ui;touch-action:manipulation}button:active,button.active{background:#e2c969;color:#263d35}button:disabled{opacity:.48}[hidden]{display:none!important}.hud{position:fixed;inset:env(safe-area-inset-top) 0 0;pointer-events:none;padding:8px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}.row{display:flex;gap:8px;align-items:flex-start}.card{pointer-events:auto;background:#18352fec;border:2px solid #b8d894;border-radius:13px;padding:8px 10px;box-shadow:0 5px 14px #0004;max-width:min(96vw,580px)}h1{font-size:16px;margin:0 0 2px}.small{font-size:14px;color:#d6e3c8}.bar{display:flex;gap:6px;overflow-x:auto;max-width:72vw;padding:2px 0;scrollbar-width:thin}.stats{min-width:160px;font-size:18px;font-weight:800}.bottom{align-items:flex-end;justify-content:space-between}.panel{max-width:min(72vw,760px);overflow:hidden;padding:6px 8px}.panel .title:empty,.panel .bar:empty,.panel[hidden]{display:none}.title{font-weight:800;font-size:14px;margin:2px 0}.queue{font-size:14px;color:#f6dd84;min-height:0}#notice{min-height:0;color:#ffe39a;font-weight:800}.groups button{min-width:44px}.minimap{width:128px;min-width:128px}.minimap-map{width:102px;height:102px;border:2px solid #e0d699;border-radius:7px;background:#839e79}.fps{position:fixed;right:12px;top:12px;background:#172e2a;color:#ecf4d6;border:2px solid #d4e1a9;border-radius:10px;padding:7px 12px;font-weight:800;z-index:5}.context button,.builds button{display:flex;align-items:center;gap:7px;white-space:normal;min-width:112px;max-width:154px;min-height:48px;padding:5px 8px}.context button span:first-child,.big-icon{font-size:24px;line-height:1}.context button span:last-child,.builds button>span:last-child{font-size:14px;text-align:left}.builds small{display:block;color:#d6e3c8;font-size:14px}.big-icon{line-height:1}.build-toggle{min-width:136px}.queue-line{white-space:nowrap}@media(max-width:700px){.hud{padding:6px}.card{padding:6px 8px}.row{gap:5px}.minimap{min-width:92px;width:92px}.minimap-map{width:72px;height:72px}.stats{min-width:128px;font-size:16px}.panel{max-width:calc(100vw - 12px)}.bar{max-width:calc(100vw - 34px)}.bottom{gap:5px}.bottom>.card:last-child{max-width:50vw}.groups{gap:3px}.groups button{padding:4px 6px;font-size:14px}.bottom .small{font-size:14px}}
  </style>
</head>
<body>
  <div id="world" aria-label="Mapa 3D de Guerra de Clanes"></div><div id="fps" class="fps" hidden></div>
  <main class="hud">
    <div class="row">
      <section class="card"><h1>Guardianes del Dosel</h1><div class="small">Contra Forja Errante · Paseo · semilla <span id="seed">917</span></div><div id="notice"></div></section>
      <section class="card stats"><div id="resources">✿ 0　✦ 0</div><div class="small">Población <span id="population">0 / 0</span></div></section>
      <section class="card minimap"><div class="title">Mapa</div><div id="minimap"></div></section>
    </div>
    <div class="row bottom">
      <section class="card panel">
        <div class="title" id="selection">Sin selección</div><div class="bar context" id="actions"></div>
        <div class="title" id="build-heading" hidden>Edificios</div><div class="bar builds" id="buildings" hidden></div>
        <div class="title" id="production-heading" hidden>Producción</div><div class="queue queue-line" id="queue-line" hidden><span id="queue">Cola vacía</span></div><div class="bar builds" id="units" hidden></div><div class="bar builds" id="heroes" hidden></div>
      </section>
      <section class="card"><div class="bar groups"><button data-group="1">1</button><button data-group="2">2</button><button data-group="3">3</button><button data-group="4">4</button><button id="home">⌂ Inicio</button><button id="pause">Ⅱ Pausa</button></div><div class="small">Rueda o pellizco: zoom · arrastra: paneo · clic derecho: orden</div></section>
    </div>
  </main>
  <script type="module" src="./src/app/main.mjs"></script>
</body>
</html>
