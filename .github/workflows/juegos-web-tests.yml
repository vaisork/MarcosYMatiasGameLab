name: Juegos web tests

on:
  pull_request:
    paths: ['senku/**', 'volando/**', 'index.html', '.github/workflows/juegos-web-tests.yml']
  push:
    branches: [main]
    paths: ['senku/**', 'volando/**', 'index.html', '.github/workflows/juegos-web-tests.yml']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test senku/vr/tests/*.test.mjs volando/tests/*.test.mjs
