# Claude Code Game Studios — configuración de MarcosYMatiasGameLab
schema_version: 1
framework:
  version: 1.3.0
  last_upgraded: 2026-11-09
project:
  name: MarcosYMatiasGameLab
  language: español
  documents_language: español
  projects:
    - name: Vintage Telnet 2
      path: vintage-telnet-2/
      engine: Python/Flask (MUD web)
      tests: cd vintage-telnet-2 && ~/proyectos/.venv-vt2/bin/python -m unittest discover -s tests -q
    - name: Senku VR
      path: senku/vr/
      engine: Web/Three.js 0.170.0/WebXR
      tests: node --test senku/vr/tests/*.test.mjs
      performance: Meta Quest; objetivo 72 FPS
engine:
  name: Web
  version: Three.js 0.170.0
  language: JavaScript (ES modules)
  rendering: Three.js; importmap desde jsDelivr
  platform: WebXR, Meta Quest y navegador
  code_root: senku/vr/
  test_root: senku/vr/tests/
